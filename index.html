  <title>Gelo &amp; Rore — Wedding Invitation</title>

<body>
  <main class="welcome-cover" id="main">
    <section class="welcome-copy" aria-labelledby="couple-names">
      <p class="welcome-kicker">Together with our families</p>

        <p>4:30 in the afternoon</p>
      </div>
      <blockquote class="welcome-verse">
        <p>“Take delight in the Lord, and he will give you the desires of your heart.”</p>
        <cite>Psalm 37:4</cite>
      </blockquote>
      <a class="welcome-button" href="./invitation.html">Open invitation <span aria-hidden="true">↗</span></a>
    </section>
    <figure class="welcome-photo">
      <img src="assets/cover-photo.jpeg" width="2480" height="4096" fetchpriority="high" alt="Gelo and Rore holding hands on a garden path beneath a leafy canopy">
      <figcaption>Zion’s Event Place · San Pedro, Laguna</figcaption>
    </figure>
